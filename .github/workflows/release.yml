# Release workflow for Markus
# Triggered when a version tag (v*) is pushed
# Builds for Linux and macOS, creates GitHub release, updates Homebrew and AUR

name: Release

on:
  push:
    tags:
      - 'v*'

env:
  NODE_VERSION: '20'

jobs:
  # Build AppImage on Linux
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build AppImage
        run: npx electron-builder --linux AppImage --publish=never

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: release/*.AppImage

  # Build DMG on macOS
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build DMG
        run: npx electron-builder --mac dmg --publish=never

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: release/*.dmg

  # Create GitHub Release with both artifacts
  release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: artifacts/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: artifacts/

      - name: Get release notes from tag
        id: tag_message
        run: |
          # Get the annotated tag message (release notes)
          TAG_MESSAGE=$(git tag -l --format='%(contents)' ${{ github.ref_name }})
          echo "Release notes:"
          echo "$TAG_MESSAGE"
          # Save to file for gh release
          echo "$TAG_MESSAGE" > release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "Markus ${{ github.ref_name }}" \
            --notes-file release_notes.md \
            artifacts/*

  # Update Homebrew tap
  update-homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Get version without v prefix
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Download macOS DMG for sha256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download ${{ github.ref_name }} \
            --repo ${{ github.repository }} \
            --pattern "*.dmg"

      - name: Calculate SHA256
        id: sha256
        run: |
          SHA256=$(sha256sum *.dmg | cut -d' ' -f1)
          echo "SHA256=$SHA256" >> $GITHUB_OUTPUT

      - name: Update Homebrew cask
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/benquemax/homebrew-markus-the-editor.git
          cd homebrew-markus-the-editor

          # Update version and sha256 in cask
          sed -i 's/version ".*"/version "${{ steps.version.outputs.VERSION }}"/' Casks/markus.rb
          sed -i 's/sha256 ".*"/sha256 "${{ steps.sha256.outputs.SHA256 }}"/' Casks/markus.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/markus.rb
          git commit -m "Update Markus to ${{ steps.version.outputs.VERSION }}"
          git push

  # Update AUR package
  update-aur:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version without v prefix
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Download AppImage for sha256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download ${{ github.ref_name }} \
            --repo ${{ github.repository }} \
            --pattern "*.AppImage"

      - name: Calculate SHA256
        id: sha256
        run: |
          SHA256=$(sha256sum *.AppImage | cut -d' ' -f1)
          echo "SHA256=$SHA256" >> $GITHUB_OUTPUT

      - name: Update PKGBUILD in main repo
        run: |
          sed -i 's/^pkgver=.*/pkgver=${{ steps.version.outputs.VERSION }}/' aur/PKGBUILD
          sed -i 's/^pkgrel=.*/pkgrel=1/' aur/PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('${{ steps.sha256.outputs.SHA256 }}')/" aur/PKGBUILD

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3.0.1
        with:
          pkgname: markus-bin
          pkgbuild: aur/PKGBUILD
          commit_username: github-actions[bot]
          commit_email: github-actions[bot]@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to version ${{ steps.version.outputs.VERSION }}"

      - name: Commit PKGBUILD update to main repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add aur/PKGBUILD
          git commit -m "chore: Update PKGBUILD for ${{ github.ref_name }}"
          git push origin HEAD:main
